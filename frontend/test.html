<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
</head>
<body>
  <div id="test"></div>
  <script type="module">
    import App from "/src/App.svelte"
    try {
      new App({ target: document.getElementById("test") })
      document.body.innerHTML += "<p style='color:green'>Mounted OK</p>"
    } catch (e) {
      document.body.innerHTML += `<p style='color:red'>Error: ${e.message}</p>`
      console.error(e)
    }
  </script>
</body>
</html>
